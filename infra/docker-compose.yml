services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tema}
      POSTGRES_DB: ${POSTGRES_DB:-tema_project_manager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tema}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Descomentar para levantar todo el stack containerizado (prod-like).
  # backend:
  #   build:
  #     context: ..
  #     dockerfile: infra/Dockerfile.backend
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-tema}:${POSTGRES_PASSWORD:-tema}@db:5432/${POSTGRES_DB:-tema_project_manager}
  #     NODE_ENV: production
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  db_data:
